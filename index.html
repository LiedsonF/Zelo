<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZELO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="container container-header">
        <div class="box box-1-header">
            <div>
                <h6>Quarta, 11 de novembro</h6>
                <h2>Meus remédios</h2>
            </div>
            <a href="#">
                <img src="./images/icon-paperclip.svg" alt="paperclip">
            </a>
        </div>
        <div class="box box-2-header">
            <div>
                <p>2 de 5 doses tomadas</p>
                <p>40%</p>
            </div>
            <span></span>
        </div>
    </header>
    <main>
        <section class="container container-atrasadas">
            <h3 class="titulo-atrasadas">ATRASADA</h3>

            <div class="box-atrasada">

                <div class="info-medicamento">
                    <h4>Losartana</h4>
                    <p>50 mg . 1 comprimido . 08:00</p>
                </div>

                <div class="status-medicamento">
                    <span>Atrasada 1h</span>
                </div>

                <button class="btn-tomei">
                    Tomei
                </button>
            </div>
        </section>

        <section class="container container-proximas">
            <h3 class="titulo-proximas">PRÓXIMAS</h3>
 
        <div class="box-proximas">

            <div class="info-medicamento">
                <h4>Metformina</h4>
                <p>500 mg . 1 comprimido . 12:00</p>
            </div>
            
            <button class="btn-tomei">
                    Tomei
            </button>
        </div>

        <div class="box-proximas">

            <div class="info-medicamento">
                <h4>Vitamina D</h4>
                <p>1 cápsula . 14:00</p>
            </div>
            
            <button class="btn-tomei">
                    Tomei
            </button>
        </div>

        </section>
    </main>
    <footer></footer>


    <script src="./js/app.js"></script>
</body>

</html>
